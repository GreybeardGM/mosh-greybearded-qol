<div class="box-list" style="--theme-color: {{themeColor}};">
  <div class="pill">{{summary}}</div>
  <div class="box-list">
    {{#each levels as |entry|}}
      <section class="box qol-overclocking-level{{#unless entry.active}} is-inactive{{/unless}}">
        <h4 class="box-heading">{{localize "MoshQoL.Cyberware.OverclockDialog.Level"}} {{entry.level}}</h4>
        <p>{{entry.effect}}</p>
      </section>
    {{/each}}
  </div>
  <small>{{localize "MoshQoL.Cyberware.OverclockDialog.Installation"}}</small>
  <small>{{localize "MoshQoL.Cyberware.OverclockDialog.Source"}}</small>
</div>
