<div class="box-list" style="--theme-color: {{themeColor}};">
  <section class="box">
    <h3 class="box-heading">{{actorName}}</h3>
    <p>{{localize "MoshQoL.Currency.App.Balance"}}: <span class="counter">{{balance}}</span></p>
    <p>{{localize "MoshQoL.Currency.App.Amount"}}</p>
    <input type="text" name="creditAmount" aria-label="{{localize 'MoshQoL.Currency.App.Amount'}}" autocomplete="off" autofocus>
    <small>{{hint}}</small>
  </section>
  <section class="box">
    <div class="form-footer">
      {{#each buttons}}
        <button type="button" data-action="{{action}}" data-credit-operation>
          <i class="fa-solid {{icon}}" aria-hidden="true"></i> <span>{{label}}</span>
        </button>
      {{/each}}
    </div>
  </section>
  <section class="box">
    <div class="form-footer">
      <select name="transferActor" aria-label="{{localize 'MoshQoL.Currency.App.Transfer'}}" {{#unless transferRecipients.length}}disabled{{/unless}}>
        {{#each transferRecipients}}
          <option value="{{id}}">{{name}}</option>
        {{else}}
          <option value="">{{localize "MoshQoL.Currency.App.NoRecipients"}}</option>
        {{/each}}
      </select>
      <button type="button" data-action="{{transferAction}}" data-credit-operation {{#unless transferRecipients.length}}disabled{{/unless}}>
        <i class="fa-solid {{transferIcon}}" aria-hidden="true"></i> {{localize "MoshQoL.Currency.App.Transfer"}}
      </button>
    </div>
  </section>
  <footer class="form-footer">
    <button type="button" data-action="cancel">
      <i class="fa-solid fa-xmark" aria-hidden="true"></i> <span>{{localize "MoshQoL.Common.Cancel"}}</span>
    </button>
  </footer>
</div>
