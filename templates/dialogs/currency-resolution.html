<section class="card" style="--theme-color: {{themeColor}};">
  {{#if label}}<p><strong>{{label}}</strong></p>{{/if}}
  <p>{{localize "MoshQoL.Currency.Invalid"}}</p>
  <pre>{{raw}}</pre>
  <p>{{reason}}</p>
  <p>{{localize "MoshQoL.Currency.Config.Notation"}}: {{notationLabel}}</p>
  <div class="form-group">
    <label for="qol-currency-input">{{localize "MoshQoL.Currency.Correction"}}</label>
    <input id="qol-currency-input" type="text" name="currencyInput" value="{{raw}}" autocomplete="off" autofocus>
  </div>
</section>
