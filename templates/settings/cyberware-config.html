<div class="settings box-list" style="--theme-color: {{themeColor}};">
  <section class="box">
    <h4 class="box-heading">{{localize "MoshQoL.Cyberware.Config.GeneralTitle"}}</h4>

    <label class="pill interactive settings-toggle">
      <span>
        <strong>{{localize "MoshQoL.Settings.EnableCyberware.Name"}}</strong>
        <small>{{localize "MoshQoL.Settings.EnableCyberware.Hint"}}</small>
      </span>
      <input type="checkbox" name="enabled" {{checked enabled}}>
    </label>
  </section>

  <small>{{localize "MoshQoL.Cyberware.Config.FormulaHint"}}</small>

  {{#each groups as |group|}}
    <section class="box">
      <h4 class="box-heading">{{group.label}}</h4>
      {{#each group.entries as |entry|}}
        <fieldset class="qol-slot-rule">
          <legend>{{entry.label}}</legend>
          <div class="inline-row">
            <label class="form-group">
              <span>{{localize "MoshQoL.Cyberware.Config.Attribute"}}</span>
              <select name="rules.{{group.actorType}}.{{entry.id}}.attribute">
                {{#each entry.attributes as |option|}}
                  <option value="{{option.value}}" {{#if option.selected}}selected{{/if}}>{{option.label}}</option>
                {{/each}}
              </select>
            </label>
            <label class="form-group">
              <span>{{localize "MoshQoL.Cyberware.Config.Multiplier"}}</span>
              <input type="number" name="rules.{{group.actorType}}.{{entry.id}}.multiplier" min="0" step="any" value="{{entry.rule.multiplier}}" required>
            </label>
            <label class="form-group">
              <span>{{localize "MoshQoL.Cyberware.Config.Round"}}</span>
              <select name="rules.{{group.actorType}}.{{entry.id}}.rounding">
                {{#each entry.rounding as |option|}}
                  <option value="{{option.value}}" {{#if option.selected}}selected{{/if}}>{{option.label}}</option>
                {{/each}}
              </select>
            </label>
            <label class="form-group">
              <span>{{localize "MoshQoL.Cyberware.Config.FlatBonus"}}</span>
              <input type="number" name="rules.{{group.actorType}}.{{entry.id}}.bonus" step="1" value="{{entry.rule.bonus}}" required>
            </label>
          </div>
        </fieldset>
      {{/each}}
    </section>
  {{/each}}

  {{> "modules/mosh-greybearded-qol/templates/settings/footer.html"}}
</div>
