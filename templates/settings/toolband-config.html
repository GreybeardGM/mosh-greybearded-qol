<div class="settings box-list" style="--theme-color: {{themeColor}};">
  <div class="box-list">
    {{#each scopes as |scope|}}
      <section class="box">
        <h4 class="box-heading">{{scope.label}}</h4>
        <div class="pill-list">
          {{#each scope.buttons as |button|}}
            <label class="pill interactive settings-toggle">
              <span class="settings-label">
                <i class="{{button.icon}}" aria-hidden="true"></i>
                <span>{{button.labelText}}</span>
              </span>
              <input type="checkbox" name="toolband.{{scope.id}}.{{button.settingKey}}" {{checked button.checked}}>
            </label>
          {{/each}}
        </div>
      </section>
    {{/each}}
  </div>

  {{> "modules/mosh-greybearded-qol/templates/settings/footer.html"}}
</div>
